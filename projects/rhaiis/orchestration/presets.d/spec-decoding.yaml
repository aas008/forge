__multiple: true

# =============================================================================
# rhaiis DSpark presets — speculative decoding comparison on H200 (Zeus/Hera)
# =============================================================================
#
# Each model group has: baseline, dspark-static (K=7), dspark-dynamic (K by
# batch-size bucket). All use vLLM 0.26.0, TP=8, profiles 1-4.
#
# Adaptive verification (enable_adaptive_verification) is omitted everywhere:
# it requires SM100 (B300). H200 (SM90) rejects it at startup.
#
# vLLM image override: set rhaiis.engines.vllm.images.nvidia in Fournos UI
# to vllm/vllm-openai:v0.26.0 (or pass via the base preset below).

# --- Shared base for all DSpark experiments ---

dspark-spec-base:
  rhaiis.accelerator: nvidia
  rhaiis.engines.vllm.images.nvidia: vllm/vllm-openai:v0.26.0
  rhaiis.engines.vllm.args.gpu-memory-utilization: 0.9
  tests.rhaiis.workload_keys:
    - profile1
    - profile2
    - profile3
    - profile4
  rhaiis.profiler.enabled: true

# --- DeepSeek-V4-Pro-0813 (TP=8, native MTP + DSpark) ---

deepseek-v4-spec-base:
  extends:
    - dspark-spec-base
  rhaiis.cluster_tag: zeus

deepseek-v4-baseline:
  extends:
    - deepseek-v4-spec-base
  tests.rhaiis.model_key: deepseek-v4-pro-0813
  tests.rhaiis.version: "vLLM-0.26.0-baseline"

deepseek-v4-mtp:
  extends:
    - deepseek-v4-spec-base
  tests.rhaiis.model_key: deepseek-v4-pro-0813-mtp
  tests.rhaiis.version: "vLLM-0.26.0-mtp"

deepseek-v4-dspark:
  extends:
    - deepseek-v4-spec-base
  tests.rhaiis.model_key: deepseek-v4-pro-0813-dspark
  tests.rhaiis.version: "vLLM-0.26.0-dspark"

deepseek-v4-dspark-dynamic:
  extends:
    - deepseek-v4-spec-base
  tests.rhaiis.model_key: deepseek-v4-pro-0813-dspark-dynamic
  tests.rhaiis.version: "vLLM-0.26.0-dspark-dynamic"

# --- GLM-5.2-FP8 (TP=8, RedHatAI DSpark speculator) ---

glm-5-2-spec-base:
