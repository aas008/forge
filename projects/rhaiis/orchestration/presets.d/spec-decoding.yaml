# --- Kimi-K3 (TP=8, community DSpark speculator, B200 target) ---
# Kimi-K3 uses MLA attention. The RadixArk speculator is community-trained.
# Forge cannot target B200 directly — these presets are for H200 testing.
# For B200 production runs, use Model Furnace bos2 controller.

kimi-k3-spec-base:
  extends:
    - dspark-spec-base
  rhaiis.cluster_tag: zeus

kimi-k3-baseline:
  extends:
    - kimi-k3-spec-base
  tests.rhaiis.model_key: kimi-k3
  tests.rhaiis.version: "vLLM-0.26.0-baseline"

kimi-k3-dspark:
